baseURL = "https://blog.yiyue.tech/"
languageCode = "zh-CN"
title = "个人技术博客"
theme = "hermit"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[pagination]
  pagerSize = 10

[params]
  description = "记录技术实践、工程思考和长期写作。"
  author = "Your Name"
  dateFormat = "2006-01-02"

[markup]
  [markup.highlight]
    noClasses = true
    style = "github-dark"
    tabWidth = 2
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 20
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 40
