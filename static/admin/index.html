<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理 - yiyue.tech</title>
  <style>
    .pdf-import-link {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      font: 600 14px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
      box-shadow: 0 12px 28px rgb(15 23 42 / 0.24);
    }

    .pdf-import-link:hover {
      background: #0f766e;
    }
  </style>
</head>
<body>
  <a class="pdf-import-link" href="./pdf-importer.html" aria-label="导入 PDF">导入 PDF</a>
  <script src="./cms-media-cleanup.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  // 标签多分隔符支持：在任意输入框输入 前缀#后缀 或 tag1|tag2 后按 Enter，自动拆分为多个标签
  (function () {
    var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;

    function setVal(input, val) {
      setter.call(input, val);
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function fireEnter(input) {
      ['keydown', 'keypress', 'keyup'].forEach(function (type) {
        input.dispatchEvent(new KeyboardEvent(type, {
          key: 'Enter', code: 'Enter', keyCode: 13, which: 13,
          bubbles: true, cancelable: true
        }));
      });
    }

    // 用捕获阶段拦截，确保在 CMS 处理之前执行
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var input = e.target;
      if (!input || input.tagName !== 'INPUT') return;

      var raw = input.value;
      // 只处理含 | 或 # 的输入
      if (!/[|#]/.test(raw)) return;

      var parts = raw.split(/[|#]/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (parts.length < 2) return;

      e.preventDefault();
      e.stopImmediatePropagation();

      // 依次写入每个 tag 并触发 Enter
      var i = 0;
      function next() {
        if (i >= parts.length) return;
        var tag = parts[i++];
        setVal(input, tag);
        setTimeout(function () {
          fireEnter(input);
          setTimeout(next, 120);
        }, 80);
      }
      // 先清空
      setVal(input, '');
      setTimeout(next, 50);
    }, true); // true = 捕获阶段
  })();
  </script>
</body>
</html>
